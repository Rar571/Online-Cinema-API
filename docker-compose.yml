version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - cinema_network

  postgres:
    image: postgres:15
    env_file:
      - .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: online_cinema_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cinema_network

  redis:
    image: redis:7-alpine
    networks:
      - cinema_network

  celery:
    build: .
    command: celery -A tasks.celery.app worker -l info
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    depends_on:
      redis:
        condition: service_started
    networks:
      - cinema_network
    dns:
      - 8.8.8.8
      - 1.1.1.1

  celery-beat:
    build: .
    command: celery -A tasks.celery.app beat -l info
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    depends_on:
      redis:
        condition: service_started
    networks:
      - cinema_network

volumes:
  postgres_data:

networks:
  cinema_network:
    driver: bridge